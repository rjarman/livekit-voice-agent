[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]

[from-bdcom]
; BDCOM delivers the call here after REGISTER. "s" = no DID in extension — use static LIVEKIT_SIP_DID in PJSIP AOR (endpoint "livekit").
exten => s,1,NoOp(Inbound from BDCOM default)
 same => n,Dial(PJSIP/livekit,120)
 same => n,Hangup()

; National / digits-only DID as extension (adjust patterns if your carrier sends +E.164)
exten => _X.,1,NoOp(Inbound DID ${EXTEN})
 same => n,Dial(PJSIP/sip:${EXTEN}@livekit-sip\;transport=udp,120)
 same => n,Hangup()

; E.164 with leading +
exten => _+X.,1,NoOp(Inbound DID ${EXTEN})
 same => n,Dial(PJSIP/sip:${EXTEN}@livekit-sip\;transport=udp,120)
 same => n,Hangup()

[default]
exten => _.,1,NoOp(Unrouted)
 same => n,Hangup()
