services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${SERVER_IP_ADDRESS}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      WEBHOOK_URL: http://${SERVER_IP_ADDRESS}:5678
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
    depends_on:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - backend

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    command: >
      --config /livekit.yaml
      --node-ip ${SERVER_IP_ADDRESS}
      --keys "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      - redis
    networks:
      - backend

  livekit-token-server:
    image: node:20-alpine
    container_name: livekit-token-server
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && node server.js"
    volumes:
      - ./livekit-token-server:/app
    ports:
      - "3001:3001"
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ws://livekit:7880
    networks:
      - backend

  livekit-agent:
    build:
      context: ./livekit-agent
      dockerfile: Dockerfile
    image: livekit-agent:latest
    container_name: livekit-agent
    restart: unless-stopped
    command: ["uv", "run", "python", "voice-agent.py", "start"]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
    depends_on:
      - livekit
    networks:
      - backend

  livekit-apple-seller-agent:
    build:
      context: ./livekit-agent
      dockerfile: Dockerfile
    image: livekit-agent:latest
    container_name: livekit-apple-seller-agent
    restart: unless-stopped
    command: ["uv", "run", "python", "apple-seller-agent-bn.py", "start"]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
      AZURE_LLM_ENDPOINT: ${AZURE_LLM_ENDPOINT}
      AZURE_LLM_API_KEY: ${AZURE_LLM_API_KEY}
      AZURE_TTS_ENDPOINT: ${AZURE_TTS_ENDPOINT}
      AZURE_TTS_API_KEY: ${AZURE_TTS_API_KEY}
      AZURE_STT_ENDPOINT: ${AZURE_STT_ENDPOINT}
      AZURE_STT_API_KEY: ${AZURE_STT_API_KEY}
      N8N_PURCHASE_WEBHOOK_URL: ${N8N_PURCHASE_WEBHOOK_URL:-}
      N8N_PRICES_WEBHOOK_URL: ${N8N_PRICES_WEBHOOK_URL:-}
    depends_on:
      - livekit
    networks:
      - backend

  livekit-apple-seller-agent-bn:
    build:
      context: ./livekit-agent
      dockerfile: Dockerfile
    image: livekit-agent:latest
    container_name: livekit-apple-seller-agent-bn
    restart: unless-stopped
    command: ["uv", "run", "python", "apple-seller-agent-bn.py", "start"]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
      AZURE_LLM_ENDPOINT: ${AZURE_LLM_ENDPOINT}
      AZURE_LLM_API_KEY: ${AZURE_LLM_API_KEY}
      AZURE_TTS_ENDPOINT: ${AZURE_TTS_ENDPOINT}
      AZURE_TTS_API_KEY: ${AZURE_TTS_API_KEY}
      AZURE_STT_ENDPOINT: ${AZURE_STT_ENDPOINT}
      AZURE_STT_API_KEY: ${AZURE_STT_API_KEY}
      N8N_PURCHASE_WEBHOOK_URL: ${N8N_PURCHASE_WEBHOOK_URL:-}
      N8N_PRICES_WEBHOOK_URL: ${N8N_PRICES_WEBHOOK_URL:-}
    depends_on:
      - livekit
    networks:
      - backend

  livekit-egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    cap_add:
      - SYS_ADMIN
    depends_on:
      - livekit
      - redis
    networks:
      - backend

  livekit-sip:
    image: livekit/sip:latest
    container_name: livekit-sip
    restart: unless-stopped
    networks:
      - backend
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 20000-21000
        use_external_ip: true
    depends_on:
      - livekit
      - redis

  sip-gateway:
    build:
      context: ./sip-gateway
      dockerfile: Dockerfile
    image: sip-gateway:latest
    container_name: sip-gateway
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    environment:
      SERVER_IP_ADDRESS: ${SERVER_IP_ADDRESS}
      BDCOM_SIP_REGISTRAR: ${BDCOM_SIP_REGISTRAR}
      BDCOM_SIP_USER: ${BDCOM_SIP_USER}
      BDCOM_SIP_PASSWORD: ${BDCOM_SIP_PASSWORD}
      BDCOM_IDENTIFY_MATCH: ${BDCOM_IDENTIFY_MATCH:-203.76.110.10/32}
      LIVEKIT_SIP_DID: ${LIVEKIT_SIP_DID}
      SIP_GATEWAY_RTP_START: ${SIP_GATEWAY_RTP_START:-10000}
      SIP_GATEWAY_RTP_END: ${SIP_GATEWAY_RTP_END:-10100}
    depends_on:
      - livekit-sip

  livekit-react-app:
    build:
      context: ./livekit-react-app
      dockerfile: Dockerfile
      args:
        VITE_SERVER_IP_ADDRESS: ${SERVER_IP_ADDRESS}
    container_name: livekit-react-app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - livekit
      - livekit-token-server
    networks:
      - backend

  livekit-dashboard:
    build:
      context: https://github.com/thinhdanggroup/livekit-dashboard.git
      dockerfile: Dockerfile
    container_name: livekit-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ADMIN_USERNAME: ${LIVEKIT_DASHBOARD_USERNAME}
      ADMIN_PASSWORD: ${LIVEKIT_DASHBOARD_PASSWORD}
      APP_SECRET_KEY: ${LIVEKIT_DASHBOARD_SECRET_KEY}
      ENABLE_SIP: true
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
    depends_on:
      - livekit
    networks:
      - backend

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - livekit
      - livekit-react-app
      - livekit-token-server
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  qdrant_data:
  caddy_data:
  caddy_config: